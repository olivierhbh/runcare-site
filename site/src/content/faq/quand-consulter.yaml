question: "Quand consulter un kiné du coureur ?"
ordre: 4
reponse: |-
  Il n'est pas nécessaire d'attendre d'être complètement arrêté pour consulter. Une douleur qui revient régulièrement, apparaît à chaque entraînement, s'intensifie progressivement ou t'oblige à modifier ta façon de courir peut justifier une consultation.

  Le kiné peut également t'accompagner lors d'une reprise après une blessure, pour retrouver progressivement tes capacités et adapter ta charge d'entraînement. L'objectif est de comprendre ta situation, traiter ce qui doit l'être et te permettre de reprendre ta pratique progressivement.
accueil: true
