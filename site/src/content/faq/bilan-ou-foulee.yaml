question: "Quelle différence entre le Bilan Diagnostic RunCare et l'analyse de foulée ?"
ordre: 3
reponse: "Le Bilan RunCare analyse ta situation dans sa globalité : historique, entraînement, objectifs, capacités physiques et douleurs éventuelles. L'analyse de foulée se concentre spécifiquement sur ta façon de courir et se réalise en présentiel."
accueil: true
