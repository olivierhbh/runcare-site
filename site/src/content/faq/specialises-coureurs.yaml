question: "Êtes-vous spécialisés dans la prise en charge des coureurs ?"
ordre: 1
reponse: "Oui. De par nos expertises de terrain et nos multiples formations, nous consacrons une part importante de notre activité à l'accompagnement des coureurs, de la rééducation à la prévention en passant par la planification de l'entraînement."
accueil: true
