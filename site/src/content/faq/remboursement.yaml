question: "Les séances sont-elles remboursées ?"
ordre: 6
reponse: "Les séances de rééducation au cabinet sont des actes de kinésithérapie, pris en charge par l'Assurance Maladie sur prescription médicale. Le Bilan RunCare, l'analyse de foulée et le coaching sont des prestations hors nomenclature, non remboursées."
accueil: false
