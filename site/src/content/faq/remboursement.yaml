question: "Les séances sont-elles remboursées ?"
ordre: 6
reponse: "Les séances de rééducation au cabinet sont des actes de kinésithérapie, pris en charge par l'Assurance Maladie sur prescription médicale. Le Bilan RunCare, l'analyse de foulée et le coaching sont aussi des actes de kinésithérapie — de la prévention des blessures — mais hors nomenclature : ils ne sont donc pas remboursés par l'Assurance Maladie."
accueil: false
