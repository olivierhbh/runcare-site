question: "Les séances sont-elles remboursées ?"
ordre: 6
reponse: "Les séances de rééducation au cabinet sont des actes de kinésithérapie, pris en charge par l'Assurance Maladie sur prescription médicale. Les prestations RunCare (bilan, analyse de foulée, coaching) sont réalisées par des kinésithérapeutes dans le cadre d'actes de prévention et d'accompagnement du coureur, hors nomenclature : elles ne sont pas remboursées par l'Assurance Maladie."
accueil: true
